# Propose chaque semaine une pull request quand une dépendance a une nouvelle version
# (et tout de suite en cas de faille de sécurité connue). La CI vérifie chaque proposition.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next et sa config ESLint vont toujours ensemble
      next:
        patterns: ["next", "eslint-config-next"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
