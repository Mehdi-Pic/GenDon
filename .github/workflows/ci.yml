# Vérifications automatiques à chaque push et à chaque pull request.
# Une PR qui casse quelque chose affiche ❌ et peut être bloquée avant le merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur la même branche annule la vérification précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    services:
      # Base jetable créée pour les tests : la production n'est jamais touchée
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gendon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gendon_test

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Le dépôt est public : aucune adresse e-mail personnelle en clair (robots d'aspiration)
      - name: Aucune adresse e-mail personnelle en clair
        run: |
          if git grep -nIiE '[a-z0-9._%+-]+@(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|orange|free|sfr|laposte|wanadoo)\.[a-z]{2,}' -- ':/' ':!*package-lock.json'; then
            echo "::error::Adresse e-mail personnelle trouvée en clair ci-dessus"
            exit 1
          fi
      - run: npm ci
      - name: Vérification des types
        run: npx tsc --noEmit
      # Bloquant : aucune erreur ni aucun avertissement toléré
      - name: Lint
        run: npx eslint app --max-warnings 0
